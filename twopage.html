<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de login</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</head>

<body>
   <div class="container">
    <div class="login-container">
        <h2 class="text-center">Login</h2>
        <form id="loginform">
             <!--Usuário-->
            <div class="form-group row">
                <label for="username" class="col-sm-1 col-form-label">Usuário</label>
                    <div class="col-sm-3">
                    <input type="text" class="form-control" id="username">
                    </div>
            </div>
            <!--Senha-->
                <div class="form-group row">
                    <label for="password" class="col-sm-1 col-form-label">Senha</label>
                    <div class="col-sm-3">
                        <input type="password" class="form-control" id="password">
                    </div>    
                </div>
            <button type="submit" class=" btn btn-primary">Entrar</button>
        </form>
    </div>
   </div>
   <script>//impede envio de formulário
        document.getElementById('loginform').addEventListener('submit', function(evento){
            event.preventDefault();
        var username = document.getElementById('username').value;
        var password = document.getElementById('password').value;

        if (username == 'admin' && password == '1234')
        window.location.href ='sucesso.html';
            else {
                alert('Usuário ou senha incorreta');
            }
        });
   </script>
</body>
</html>
